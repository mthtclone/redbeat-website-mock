<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — RedBeats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="toast" id="toast">
  <span class="material-symbols-outlined">check_circle</span>
  <span id="toast-text">Added to cart</span>
</div>

<div class="overlay-scrim" id="scrim" onclick="closeCart()"></div>
<aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart">
  <div class="cart-drawer-head">
    <h3>Your cart</h3>
    <button class="icon-btn" onclick="closeCart()" aria-label="Close cart">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-drawer-foot">
    <div class="cart-subtotal-row"><span>Subtotal</span><strong id="cart-subtotal">$0.00</strong></div>
    <button class="btn btn-primary btn-block" onclick="goToCheckout()">
      <span class="material-symbols-outlined">shopping_cart_checkout</span> Checkout
    </button>
  </div>
</aside>

<header class="topnav">
  <div class="topnav-inner">
    <a class="logo" href="index.html">Red<span>Beats</span></a>
    <nav class="nav-links" id="nav-links">
      <a class="nav-link" href="browse.html">Browse Beats</a>
      <button class="cart-btn" onclick="openCart()" aria-label="Open cart">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="cart-badge" id="cart-badge-nav" style="display:none;">0</span>
      </button>
      <a class="nav-link" href="register.html?mode=login">Login</a>
      <a class="btn btn-primary btn-sm" href="register.html">Sign Up</a>
    </nav>
    <a class="mobile-nav-toggle" href="browse.html" aria-label="Browse beats">
      <span class="material-symbols-outlined">menu</span>
    </a>
  </div>
</header>

<main class="shell" id="page-checkout">
  <div class="checkout-grid">
    <div class="checkout-panel">
      <h3>Order summary</h3>
      <div id="checkout-items"></div>
      <div class="order-totals" id="checkout-totals-wrap">
        <div class="order-total-row"><span>Subtotal</span><span id="checkout-subtotal">$0.00</span></div>
        <div class="order-total-row"><span>Tax (10%)</span><span id="checkout-tax">$0.00</span></div>
        <div class="order-total-row grand"><span>Total</span><span id="checkout-total">$0.00</span></div>
      </div>
    </div>

    <div class="checkout-panel">
      <h3>Payment details</h3>
      <div class="pay-tabs">
        <div class="pay-tab active" id="tab-card" onclick="setPayTab('card')">Card</div>
        <div class="pay-tab" id="tab-local" onclick="setPayTab('local')">Local payment</div>
      </div>

      <div class="field">
        <label for="co-email">Email</label>
        <input type="email" id="co-email" placeholder="you@example.com">
      </div>

      <div id="pay-card-fields">
        <div class="field">
          <label for="co-card">Card number</label>
          <input type="text" id="co-card" placeholder="4242 4242 4242 4242">
        </div>
        <div class="card-row">
          <div class="field">
            <label for="co-exp">Expiry</label>
            <input type="text" id="co-exp" placeholder="MM / YY">
          </div>
          <div class="field">
            <label for="co-cvv">CVV</label>
            <input type="text" id="co-cvv" placeholder="123">
          </div>
        </div>
      </div>

      <div id="pay-local-fields" style="display:none;">
        <div class="local-pay-row">
          <button class="local-pay-btn" id="pay-kbz" onclick="selectLocalPay('kbz')">KBZPay</button>
          <button class="local-pay-btn" id="pay-wave" onclick="selectLocalPay('wave')">WavePay</button>
        </div>
        <p style="color:var(--text-secondary);font-size:12.5px;margin-top:8px;">You'll be redirected to complete payment after clicking checkout.</p>
      </div>

      <button class="btn btn-primary btn-block" style="margin-top:22px;padding:16px;font-size:16px;" onclick="completeCheckout()">Checkout</button>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
