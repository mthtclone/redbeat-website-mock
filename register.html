<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — RedBeats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="toast" id="toast">
  <span class="material-symbols-outlined">check_circle</span>
  <span id="toast-text">Added to cart</span>
</div>

<section id="page-register">
  <div class="auth-topbar">
    <a class="logo" href="index.html">Red<span>Beats</span></a>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h2 class="auth-heading" id="auth-heading">Create your account</h2>
      <p class="auth-sub" id="auth-sub">Join as a producer or an artist to start trading beats.</p>

      <div class="role-select" id="role-select">
        <button class="role-option" data-role="producer" onclick="selectRole('producer')">
          <div class="role-text">
            <strong>Register as Producer</strong>
            <small>Upload and sell your beats</small>
          </div>
          <span class="material-symbols-outlined">graphic_eq</span>
        </button>
        <button class="role-option" data-role="artist" onclick="selectRole('artist')">
          <div class="role-text">
            <strong>Register as Artist</strong>
            <small>Find beats and license tracks</small>
          </div>
          <span class="material-symbols-outlined">mic</span>
        </button>
      </div>

      <div class="social-row">
        <button class="social-btn"><span class="glyph">G</span> Continue with Google</button>
        <button class="social-btn"><span class="glyph"></span> Continue with Apple</button>
        <button class="social-btn"><span class="glyph" style="color:#5865F2;">D</span> Continue with Discord</button>
      </div>
      <div class="divider-row">or use your email</div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input type="password" id="pw" placeholder="••••••••">
      </div>
      <div class="field" id="confirm-field">
        <label for="pw2">Confirm your password</label>
        <input type="password" id="pw2" placeholder="••••••••">
      </div>

      <label class="consent-row" id="consent-row">
        <input type="checkbox">
        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
      </label>

      <button class="btn btn-primary btn-block" id="auth-submit" onclick="submitAuth()">Create account</button>

      <div class="auth-switch" id="auth-switch">
        Already have an account? <button onclick="toggleAuthMode()">Log in</button>
      </div>
    </div>
  </div>
</section>

<script src="js/app.js"></script>
<script src="js/register.js"></script>
</body>
</html>
